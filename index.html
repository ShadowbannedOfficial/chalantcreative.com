<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHALANT CREATIVE — Coming Soon</title>
<meta name="description" content="Chalant Creative. Something is coming. Under construction.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="CHALANT CREATIVE — Coming Soon">
<meta property="og:description" content="Under construction. Coming soon.">
<meta property="og:image" content="https://chalantcreative.com/logo.png">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root{
    --tape:#ffd400;
    --ink:#0a0a0a;
    /* tan(2.5deg): the ribbon's tilt, used to square the anchor with it */
    --tilt:.043661;
  }
  *{box-sizing:border-box}
  html,body{height:100%;height:100dvh}
  body{
    margin:0;
    background:#000;
    color:#fff;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  }

  /* ------------------------------------------------------------------
     The wordmark and the ribbon share one measuring system, so the tape
     is pinned to the letters rather than to a percentage of the window.

     .mark is sized to the exact ink box of the wordmark (1370 x 468 in
     source pixels), so every offset below is a fraction of the real
     letterforms, never of the window. Within that box CHALANT runs from
     row 0 to row 217, putting its cap midline 108.5/468 = 23.18% down
     the box. (.234 is that figure nudged to sit dead centre of the
     ribbon's antialiased lower edge, as rendered.)

     The ribbon hangs from its own bottom edge (transform-origin 50%
     100%) and is rotated about that point, so the tilt can never drag
     the anchor off target. --tape-drop biases that anchor down by half
     the tilt's rise between the screen centre and the wordmark's centre,
     which parks the lower edge on CHALANT's midline at both ends of the
     mark instead of only at the screen centre.
     ------------------------------------------------------------------ */
  .stage{
    position:fixed;
    inset:0;
    overflow:hidden;

    /* 66vw holds the mark's centre close to the screen centre. The ribbon
       is tilted, so its straight lower edge can be exactly on CHALANT's
       midline at only one x: the screen centre and the wordmark's centre
       have to share the error between them. A bigger mark keeps the two
       points closer together, and keeps that shared error inside tolerance
       at every shape. The height cap only steps in on short windows, so
       the lines under the wordmark stay on screen and the mark never
       grows taller than the space above them. */
    --copy-gap:clamp(16px,2dvh,28px);
    --copy-block:clamp(150px,20dvh,220px);
    --stage-pad:max(clamp(12px,2.2dvh,28px),env(safe-area-inset-bottom,0px));
    --mark-bottom:calc(var(--copy-gap) + var(--copy-block) + var(--stage-pad));
    --mark-w:min(66vw,calc((100dvh - var(--mark-bottom) - 2dvh) * 1370 / 468));
    --mark-h:calc(var(--mark-w) * 468 / 1370);
    --mark-right:5vw;
    --mark-left:calc(100% - var(--mark-right) - var(--mark-w));
    --mark-top:calc(100dvh - var(--mark-bottom) - var(--mark-h));

    --chalant-mid:calc(var(--mark-top) + var(--mark-h) * .234);
    --tape-drop:calc((50vw - var(--mark-right) - var(--mark-w) / 2) * var(--tilt) / 2);
    --tape-h:min(22.4vmax,34dvh);
    --tape-top:calc(var(--chalant-mid) + var(--tape-drop) - var(--tape-h));
  }

  .mark{
    position:absolute;
    top:var(--mark-top);
    right:var(--mark-right);
    width:var(--mark-w);
    height:var(--mark-h);
  }
  /* logo.png and lockup.png are cropped to the same ink, so a matching
     negative offset cancels the transparent margin: the box edge is the
     edge of the letterforms. */
  .mark img{
    position:absolute;
    display:block;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  /* logo.png 3000x3000 — ink at x1607..2976, y1272..1739 */
  .mark--wide img{
    width:calc(var(--mark-w) * 3000 / 1370);
    left:calc(var(--mark-w) * -1607 / 1370);
    top:calc(var(--mark-h) * -1272 / 468);
  }
  /* lockup.png 1418x517 — ink at x25..1394, y25..492 */
  .mark--tall img{
    width:calc(var(--mark-w) * 1418 / 1370);
    left:calc(var(--mark-w) * -25 / 1370);
    top:calc(var(--mark-h) * -25 / 468);
  }
  .mark--tall{display:none}

  /* ---------- photoreal caution tape ---------- */
  .tape{
    position:absolute;
    left:50%;
    top:var(--tape-top);
    width:150vmax;
    height:var(--tape-h);
    transform-origin:50% 100%;
    transform:translateX(-50%) rotate(-2.5deg);
    /* the tile is a whole number of stripe periods wide (9 x 424px), so it
       repeats without a seam, and sizing it by the ribbon's height keeps
       the stripe angle identical at every viewport width */
    background-image:url("tape-tile.jpg");
    background-repeat:repeat-x;
    background-position:50% 50%;
    background-size:auto 100%;
    pointer-events:none;
  }
  .tape__text{
    position:absolute;
    left:0;
    right:0;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0 .55em;
    padding-inline:2vw;
    color:#0a0a0a;
    font-weight:800;
    font-size:clamp(13px,calc(var(--tape-h) * .115),44px);
    line-height:1;
    letter-spacing:.015em;
    text-transform:uppercase;
    white-space:nowrap;
    text-shadow:none;
  }
  .dot{
    width:.2em;
    height:.2em;
    border-radius:50%;
    background:#0a0a0a;
    flex:0 0 auto;
  }

  /* ---------- lines under the wordmark, left-aligned to its ink ---------- */
  .lines{
    position:absolute;
    z-index:2;
    left:var(--mark-left);
    top:calc(var(--mark-top) + var(--mark-h) + var(--copy-gap));
    width:max-content;
    max-width:calc(100% - var(--mark-left) - var(--mark-right));
    margin:0;
    text-align:left;
    color:#fff;
  }
  .pair{
    margin:0;
    font-size:clamp(16px,1.35vw,24px);
    line-height:1.15;
    font-weight:400;
  }
  .pair + .pair{margin-top:0.72em}
  .slogan,
  .support{display:block;white-space:nowrap}
  .slogan{
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .support{
    margin-top:0.12em;
    font-size:0.74em;
    font-weight:400;
    line-height:1.25;
    letter-spacing:0.01em;
  }

  /* ---------- iPhone / portrait: centred lockup ---------- */
  @media (max-aspect-ratio:1/1){
    .stage{
      --mark-w:min(88vw,152dvh,calc((100dvh - var(--copy-gap) - var(--copy-block) - var(--stage-pad) - 8dvh) * 1370 / 468));
      --mark-left:calc(50% - var(--mark-w) / 2);
      --mark-top:min(
        calc(60dvh - var(--mark-h) / 2),
        calc(100dvh - var(--copy-gap) - var(--copy-block) - var(--stage-pad) - var(--mark-h))
      );
      --tape-drop:0px;
      --tape-h:min(35.6vw,26dvh);
    }
    .mark{right:auto;left:var(--mark-left)}
    .mark--wide{display:none}
    .mark--tall{display:block}
    .tape__text{
      font-size:clamp(12px,calc(var(--tape-h) * .115),30px);
      letter-spacing:.005em;
      gap:0 .45em;
      padding-inline:1vw;
    }
  }

  @media (prefers-reduced-motion:no-preference){
    .tape{animation:settle .8s cubic-bezier(.22,.8,.24,1) both}
    /* transform only — the ribbon never fades, so it is always fully opaque */
    @keyframes settle{
      from{transform:translateX(-50%) rotate(-2.5deg) translateY(-18px)}
      to{transform:translateX(-50%) rotate(-2.5deg)}
    }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="mark mark--wide"><img src="logo.png" alt="Chalant Creative" width="3000" height="3000"></div>
    <div class="mark mark--tall"><img src="lockup.png" alt="Chalant Creative" width="1418" height="517"></div>
    <div class="tape" role="img" aria-label="Under construction. Coming soon.">
      <div class="tape__text">
        <span>Under Construction</span>
        <span class="dot" aria-hidden="true"></span>
        <span>Coming Soon</span>
      </div>
    </div>
    <div class="lines">
      <p class="pair"><span class="slogan">Entertain the masses</span><span class="support">Stop the scroll</span></p>
      <p class="pair"><span class="slogan">Educate the interested</span><span class="support">Teach</span></p>
      <p class="pair"><span class="slogan">Sell the committed</span><span class="support">Cash in</span></p>
    </div>
  </main>
</body>
</html>
